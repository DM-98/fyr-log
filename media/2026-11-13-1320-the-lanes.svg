<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="How the rebuild is split: ten lanes, each an agent in its own worktree, around one main branch kept by the integrator">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6fb7d8"/>
    </marker>
  </defs>
  <rect width="980" height="540" fill="#12100f"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#efe9e0">
    <!-- the top row of lanes -->
    <g>
      <rect x="24" y="30" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="36" y="55" font-size="15" font-weight="bold">Hut and walk</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="36" y="78">the hut and its desk</tspan><tspan x="36" y="94">camera; the walk out</tspan><tspan x="36" y="110">to the tower</tspan></text>

      <rect x="213" y="30" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="225" y="55" font-size="15" font-weight="bold">Map and plan</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="225" y="78">the chart on the PC,</tspan><tspan x="225" y="94">buying and placing,</tspan><tspan x="225" y="110">the live map</tspan></text>

      <rect x="402" y="30" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="414" y="55" font-size="15" font-weight="bold">Stations</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="414" y="78">the Gun, the Laser and</tspan><tspan x="414" y="94">the Lens; the lantern</tspan><tspan x="414" y="110">room</tspan></text>

      <rect x="591" y="30" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="603" y="55" font-size="15" font-weight="bold">Tablet and guide</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="603" y="78">CUT! and ACTION!;</tspan><tspan x="603" y="94">the guide's 22 lines</tspan><tspan x="603" y="110">for a new player</tspan></text>

      <rect x="780" y="30" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="792" y="55" font-size="15" font-weight="bold">Battle and economy</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="792" y="78">saucers, turrets,</tspan><tspan x="792" y="94">credits, the nights,</tspan><tspan x="792" y="110">the bot that plays</tspan></text>
    </g>

    <!-- main -->
    <rect x="24" y="214" width="932" height="96" rx="10" fill="#16242b" stroke="#6fb7d8" stroke-width="1.8"/>
    <text x="490" y="244" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1">MAIN · THE INTEGRATOR</text>
    <text font-size="13" fill="#d8d1c6" text-anchor="middle"><tspan x="490" y="268">merges one branch at a time, builds the game, runs a two-minute test in which a bot plays, and takes</tspan><tspan x="490" y="288">a branch out again if it fails. The shared headers between the parts (the seams) change only here.</tspan></text>

    <!-- the bottom row of lanes -->
    <g>
      <rect x="24" y="394" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="36" y="419" font-size="15" font-weight="bold">Render</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="36" y="442">storm, rain and light;</tspan><tspan x="36" y="458">ray tracing, DLSS,</tspan><tspan x="36" y="474">Reflex latency</tspan></text>

      <rect x="213" y="394" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="225" y="419" font-size="15" font-weight="bold">Explosions</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="225" y="442">fire and smoke</tspan><tspan x="225" y="458">simulated in Blender,</tspan><tspan x="225" y="474">as sprite sheets</tspan></text>

      <rect x="402" y="394" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="414" y="419" font-size="15" font-weight="bold">Assets and audio</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="414" y="442">Rodin and local</tspan><tspan x="414" y="458">models, sounds, music</tspan><tspan x="414" y="474">and voices</tspan></text>

      <rect x="591" y="394" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c"/>
      <text x="603" y="419" font-size="15" font-weight="bold">Verifier</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="603" y="442">plays main after every</tspan><tspan x="603" y="458">merge and hunts faults,</tspan><tspan x="603" y="474">with pictures</tspan></text>

      <rect x="780" y="394" width="176" height="100" rx="8" fill="#1c1a18" stroke="#5a544c" stroke-dasharray="5 4"/>
      <text x="792" y="419" font-size="15" font-weight="bold">Production log</text>
      <text font-size="12" fill="#d8d1c6"><tspan x="792" y="442">reads main and the</tspan><tspan x="792" y="458">lanes' boards, and</tspan><tspan x="792" y="474">writes this log</tspan></text>
    </g>

    <!-- merges into main, tests out of it -->
    <g stroke="#6fb7d8" stroke-width="2" fill="none">
      <line x1="112" y1="132" x2="112" y2="210" marker-end="url(#a)"/>
      <line x1="301" y1="132" x2="301" y2="210" marker-end="url(#a)"/>
      <line x1="490" y1="132" x2="490" y2="210" marker-end="url(#a)"/>
      <line x1="679" y1="132" x2="679" y2="210" marker-end="url(#a)"/>
      <line x1="868" y1="132" x2="868" y2="210" marker-end="url(#a)"/>
      <line x1="112" y1="392" x2="112" y2="314" marker-end="url(#a)"/>
      <line x1="301" y1="392" x2="301" y2="314" marker-end="url(#a)"/>
      <line x1="490" y1="392" x2="490" y2="314" marker-end="url(#a)"/>
      <line x1="679" y1="312" x2="679" y2="390" marker-end="url(#a)"/>
      <line x1="868" y1="312" x2="868" y2="390" marker-end="url(#a)" stroke-dasharray="5 4"/>
    </g>
    <g font-size="12" fill="#9fc9de">
      <text x="122" y="176">merge</text>
      <text x="122" y="358">merge</text>
      <text x="689" y="358">tests</text>
      <text x="878" y="358">reads</text>
    </g>
    <text x="24" y="524" font-size="13" fill="#9a9288">Each lane is one Claude Code agent in its own git worktree and branch: it builds and runs its own copy of the game and owns its own files.</text>
  </g>
</svg>
